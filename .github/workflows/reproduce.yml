name: Reproduce XML documentation newline difference

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Build and inspect the real generated document
        shell: pwsh
        run: |
          dotnet build --configuration Release --no-incremental
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet --info | Out-File artifacts/dotnet-info.txt -Encoding utf8
          node verify.mjs
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/

  compare:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts/
      - run: node compare.mjs
